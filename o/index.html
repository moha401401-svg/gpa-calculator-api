<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA for FCAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h2 { text-align: center; color: #fff; margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2); color: white; font-size: 16px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--primary); }
        button {
            width: 100%; padding: 15px; border-radius: 10px; border: none;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        #sectionSelect { margin-bottom: 20px; display: flex; justify-content: space-between; }
        #sectionSelect button { width: 48%; }

        #result {
            margin-top: 25px; padding: 20px; border-radius: 12px; text-align: center;
            display: none; border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }
        .gpa-value { font-size: 40px; font-weight: bold; margin: 10px 0; }
        .message { font-size: 20px; font-weight: bold; padding: 10px; border-radius: 8px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">

    
    <div id="sectionSelect">
        <button id="scienceBtn">علمي علوم</button>
        <button id="mathBtn">علمي رياضة</button>
    </div>

    
    <form id="gpaForm" style="display:none;">
        <h2>🎓 GPA Calc</h2>
        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="Optional">
        </div>
        <div class="input-group"><label>Computer Science (CS)</label><input type="number" id="CS" required min="0" max="100" step="0.01"></div>
        <div class="input-group" id="Math1Group"><label>Math 1</label><input type="number" id="Math1" min="0" max="100"step="0.01"></div>
        <div class="input-group"><label>Discrete Math</label><input type="number" id="Discrete" required min="0" max="100"step="0.01"></div>
        <div class="input-group"><label>Electronics</label><input type="number" id="Elctronics" required min="0" max="100"step="0.01"></div>
        <div class="input-group"><label>Creative Thinking</label><input type="number" id="Creative_thinking" required min="0" max="100"step="0.01"></div>
        <div class="input-group"><label>Technical Writing</label><input type="number" id="Technical_writing" required min="0" max="100"step="0.01"></div>
        <button type="submit">GPA</button>
    </form>

    <div id="result">
        <p>Your GPA 😉:</p>
        <div class="gpa-value" id="gpaDisplay">0.00</div>
        <div class="message" id="gpaMessage"></div>
    </div>

</div>

<script>
    const scienceBtn = document.getElementById('scienceBtn');
    const mathBtn = document.getElementById('mathBtn');
    const gpaForm = document.getElementById('gpaForm');
    const Math1Group = document.getElementById('Math1Group');
    const resultDiv = document.getElementById('result');
    const gpaDisplay = document.getElementById('gpaDisplay');
    const gpaMessage = document.getElementById('gpaMessage');

    let endpoint = '';

    scienceBtn.onclick = () => {
        endpoint = 'https://mysql-fastapi-production-a873.up.railway.app/GPA2';
        gpaForm.style.display = 'block';
        Math1Group.style.display = 'none';
        resultDiv.style.display = 'none';
    };

    mathBtn.onclick = () => {
        endpoint = 'https://mysql-fastapi-production-a873.up.railway.app/GPA';
        gpaForm.style.display = 'block';
        Math1Group.style.display = 'block';
        resultDiv.style.display = 'none';
    };

    function getMessage(gpa) {
        if (gpa === 4) return { text: "تنين مجنح 🐉", color: "#fbbf24" };
        if (gpa >= 3 && gpa < 4) return { text: "جامد جداً 🔥", color: "#10b981" };
        if (gpa >= 2 && gpa < 3) return { text: "عاش 👏", color: "#3b82f6" };
        if (gpa >= 1 && gpa < 2) return { text: "هتعوض يا بطل 💪", color: "#f97316" };
        return { text: "عملتها إزاي دي؟ 🤔", color: "#ef4444" };
    }

    gpaForm.onsubmit = async (e) => {
        e.preventDefault();

        const data = {
            name: document.getElementById('name').value || null,
            CS: parseFloat(document.getElementById('CS').value),
            Math1: endpoint.includes('GPA') ? parseFloat(document.getElementById('Math1').value) : undefined,
            Discrete: parseFloat(document.getElementById('Discrete').value),
            Elctronics: parseFloat(document.getElementById('Elctronics').value),
            Creative_thinking: parseFloat(document.getElementById('Creative_thinking').value),
            Technical_writing: parseFloat(document.getElementById('Technical_writing').value)
        };

        Object.keys(data).forEach(key => data[key] === undefined && delete data[key]);

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                const gpa = parseFloat(result['Your GPA']);
                gpaDisplay.innerText = gpa.toFixed(2);

                const msgData = getMessage(gpa);
                gpaMessage.innerText = msgData.text;
                gpaMessage.style.color = msgData.color;
                gpaDisplay.style.color = msgData.color;

                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('API!');
            }
        } catch (error) {
            console.error(error);
            alert('CORS!');
        }
    };
</script>

</body>
</html>
