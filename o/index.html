<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GPA Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h2 { text-align: center; color: #fff; margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
        }
        .gpa-value { font-size: 32px; font-weight: bold; color: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎓 GPA for FCAI</h2>
    <form id="gpaForm">
        <div class="input-group">
            <label>Name (optional)</label>
            <input type="text" id="name" placeholder=" Enter your name">
        </div>
        <div class="input-group"><label>Computer Science (CS)</label><input type="number" id="CS" required min="0" max="100"></div>
        <div class="input-group"><label>Math 1</label><input type="number" id="Math1" required min="0" max="100"></div>
        <div class="input-group"><label>Discrete Math</label><input type="number" id="Discrete" required min="0" max="100"></div>
        <div class="input-group"><label>Electronics</label><input type="number" id="Elctronics" required min="0" max="100"></div>
        <div class="input-group"><label>Creative Thinking</label><input type="number" id="Creative_thinking" required min="0" max="100"></div>
        <div class="input-group"><label>Technical Writing</label><input type="number" id="Technical_writing" required min="0" max="100"></div>
        
        <button type="submit" > GPA </button>
    </form>

    <div id="result">
        <h2>  Your GPA 😉:</h2>
        <div class="gpa-value" id="gpaDisplay">0.00</div>
    </div>
</div>

<script>
    const form = document.getElementById('gpaForm');
    const resultDiv = document.getElementById('result');
    const gpaDisplay = document.getElementById('gpaDisplay');

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        const data = {
            name: document.getElementById('name').value || null,
            CS: parseInt(document.getElementById('CS').value),
            Math1: parseInt(document.getElementById('Math1').value),
            Discrete: parseInt(document.getElementById('Discrete').value),
            Elctronics: parseInt(document.getElementById('Elctronics').value),
            Creative_thinking: parseInt(document.getElementById('Creative_thinking').value),
            Technical_writing: parseInt(document.getElementById('Technical_writing').value)
        };

        try {
            const response = await fetch('https://correspondently-preadvisable-javon.ngrok-free.dev/GPA', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                gpaDisplay.innerText = result['Your GPA'] || result['GPA']; 
                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('حدث خطأ في الاتصال بالسيرفر، تأكد أن ngrok يعمل!');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('فشل الاتصال: تأكد من تشغيل FastAPI و ngrok');
        }
    };
</script>

</body>
</html>
